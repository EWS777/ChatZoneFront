<div #dropdownContainer class="relative">
  <button (click)="toggleDropdown($event)" [disabled]="disabled" [class.opacity-50]="disabled" [class.!cursor-not-allowed]="disabled" class="w-full border-input select-none !cursor-pointer flex items-center justify-between text-xs" type="button">
    <span [class]="selectedValue !== null && selectedValue !== undefined ? 'text-[#FFFFFF]' : 'text-[#494A4E]'">
      {{ selectedLabel || placeholder }}
    </span>
    <svg [class.rotate-180]="isOpen" class="h-5 w-5 text-gray-500 transition-transform duration-400" fill="currentColor" viewBox="0 0 20 20">
      <path clip-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z" fill-rule="evenodd"/>
    </svg>
  </button>

  @if (isOpen) {
    <div class="absolute z-10 mt-1 w-full bg-[#192337] rounded-[10px] shadow-[0_12px_16px_-4px_rgba(16,24,40,0.10),0_4px_6px_-2px_rgba(16,24,40,0.05)] overflow-hidden">
      @if (searchable) {
        <div class="p-2 border-b border-[#47588C]">
          <input #searchInput [value]="searchTerm" (input)="onSearch(searchInput.value)" type="text" placeholder="Search..." maxlength="100"
                 class="w-full bg-transparent outline-none text-sm text-white placeholder:text-[#494A4E] px-2 py-1">
        </div>
      }
      <div class="max-h-60 overflow-y-auto custom-scrollbar py-1">
        @if (clearLabel) {
          <div (click)="selectItem({ value: null, label: '' })" class="py-2 px-4 hover:bg-[#47588C] cursor-pointer select-none text-sm md:text-base text-[#B4B4B4] transition-colors duration-150">
            {{ clearLabel }}
          </div>
        }
        @for (item of visibleItems; track item.value) {
          <div (click)="selectItem(item)" class="py-2 px-4 hover:bg-[#47588C] cursor-pointer select-none text-sm md:text-base text-white transition-colors duration-150">
            {{ item.label }}
          </div>
        } @empty {
          @if (searchable) {
            <div class="py-2 px-4 select-none text-sm text-[#494A4E]">Nothing found</div>
          }
        }
      </div>
    </div>
  }
</div>
